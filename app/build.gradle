plugins {
    id "java"
    id "com.diffplug.spotless" version "8.11.0"
    id "io.spring.dependency-management" version "1.1.7"
    id 'org.springframework.boot' version '4.1.2'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

group = "it.chalmers"

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    annotationProcessor(
            // Used to generate Record Builder classes
            "io.soabase.record-builder:record-builder-processor:53",
    )

    implementation(
            // Used to generate Record Builder classes
            "io.soabase.record-builder:record-builder-core:53",

            // Used to handle SQL specific errors
            "org.postgresql:postgresql:42.7.14",

            // Spring Boot
            "org.springframework.boot:spring-boot-starter-data-jpa",
            "org.springframework.boot:spring-boot-starter-data-redis",
            "org.springframework.boot:spring-boot-starter-security",
            "org.springframework.boot:spring-boot-starter-validation",
            "org.springframework.boot:spring-boot-starter-web",
            "org.springframework.boot:spring-boot-starter-oauth2-authorization-server",

            "org.springframework.security:spring-security-webauthn",
            "com.eatthepath:java-otp:1.0.0",
            "commons-codec:commons-codec",
            "com.google.zxing:core:3.5.4",

            // Spring session
            "org.springframework.boot:spring-boot-starter-session-data-redis",

            // Redis
            "org.springframework.data:spring-data-redis",
    )

    compileOnly(
            // Testcontainers for local dev service startup
            "org.testcontainers:testcontainers:2.0.5",
            "org.testcontainers:testcontainers-postgresql:2.0.5",
    )

    developmentOnly(
            // Testcontainers for local dev service startup
            "org.testcontainers:testcontainers:2.0.5",
            "org.testcontainers:testcontainers-postgresql:2.0.5",
    )

   runtimeOnly(
            // FlywayDB (Database migration)
            "org.springframework.boot:spring-boot-starter-flyway",
            "org.flywaydb:flyway-database-postgresql",

            // Spring Boot
            "org.springframework.boot:spring-boot-devtools",
            "org.springframework.boot:spring-boot-starter-thymeleaf",

            // Thymeleaf
            "org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.5.RELEASE",

            // web dependencies
            "org.webjars.npm:htmx.org:4.0.1",
            "org.webjars.npm:hyperscript.org:0.9.93",
            "org.webjars.npm:sortablejs:1.15.7"
    )
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("bootBuildImage") {
    builder = "paketobuildpacks/builder-noble-java-tiny:0.0.211"
    environment = ["BP_JVM_VERSION": "25.*"]
}


spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
        formatAnnotations()
    }

    yaml {
        target "src/**/*.yml"
        jackson()
    }

    json {
        target "src/**/*.json"
        jackson()
    }
}
