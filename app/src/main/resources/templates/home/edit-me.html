<form th:object="${form}" th:data-hx-post="@{/me}" data-hx-target="this" data-hx-swap="outerHTML">
    <article>
        <header>
            <h2>Editing your information</h2>
        </header>
        <div th:replace="~{common/form-csrf}"></div>
        <input type="hidden" name="_method" value="put"/>
        <th:block th:with="autofill=true">
            <div th:replace="~{common/input :: textInput2('nick', 'Nick')}"></div>
            <div th:replace="~{common/input :: textInput2('firstName', 'First name')}"></div>
            <div th:replace="~{common/input :: textInput2('lastName', 'Last name')}"></div>
        </th:block>
        <label class="field">
            <span class="field__label">Language</span>
            <select class="input input--select" th:field="*{language}">
                <option value="SV">
                    Swedish
                </option>
                <option value="EN">
                    English
                </option>
            </select>
        </label>
        <div th:replace="~{common/error :: text}"></div>
        <footer>
            <button data-hx-get="/me/cancel-edit" data-hx-target="closest form" data-hx-swap="outerHTML" class="button button--secondary" type="button" data-loading-disable>Cancel</button>
            <button class="button" data-loading-disable>Save</button>
        </footer>
    </article>
</form>
