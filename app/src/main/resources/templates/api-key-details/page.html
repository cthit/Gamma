<header th:replace="~{common/header}"></header>
<main>
    <th:block th:if="${apiKeyToken!= null}">
        <article th:replace="~{partial/api-key-credentials}"></article>
    </th:block>

    <article th:fragment="details(details)">
        <header>
            Api key details
        </header>
        <ul class="tuple">
            <li>
                <b>Pretty name</b>
                <span th:text="${apiKey.prettyName()}"></span>
            </li>
            <li>
                <b>Type</b>
                <span th:text="${apiKey.keyType()}"></span>
            </li>
            <li>
                <b>Scopes</b>
                <ul>
                    <li th:each="scopeName : ${apiKey.scopes()}">
                        <span th:text="${scopeName}"></span>
                        <span th:if="${#lists.contains(sensitiveScopes, scopeName)}"
                              class="badge sensitive">Sensitive</span>
                    </li>
                </ul>
            </li>
            <li>
                <b>Swedish description</b>
                <span th:text="${apiKey.svDescription()}"></span>
            </li>
            <li>
                <b>English description</b>
                <span th:text="${apiKey.enDescription()}"></span>
            </li>
        </ul>
        <footer th:if="${details != null && details}">
            <a th:href="|/api-keys/${apiKey.id()}|">
                <button class="outline contrast">
                    More details
                </button>
            </a>
        </footer>
        <footer th:if="${details == null || !details}">
            <form data-hx-confirm="Are you sure you want to reset the token? The old token will be immediately revoked."
                  data-hx-target="body"
                  th:data-hx-headers="${redirectUri != null} ? '{&quot;redirectUri&quot;: &quot;' + ${redirectUri} + '&quot;}' : null" th:data-hx-post="|/api-keys/${apiKey.id()}/reset|">
                <div th:replace="~{common/form-csrf}"></div>
                <button class="outline contrast" data-loading-disable>Reset token</button>
            </form>
            <form data-hx-confirm="Are you sure you want to delete this api key?" th:data-hx-post="|/api-keys/${apiKey.id()}|">
                <input type="hidden" name="_method" value="delete" />
                <div th:replace="~{common/form-csrf}"></div>
                <button class="outline contrast" data-loading-disable>Delete</button>
            </form>
        </footer>
    </article>

    <th:block th:if="${unifiedIncludedTypes != null}">
        <article>
            <header>Super group type restrictions</header>
            <p>Only super groups of selected types will be included in responses.</p>
            <form data-hx-put="|/api-keys/${apiKeyId}/unified-settings|"
                  data-hx-target="body"
                  data-hx-swap="innerHTML">
                <input type="hidden" name="_method" value="PUT" />
                <div th:replace="~{common/form-csrf}"></div>
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Included</th>
                            <th th:if="${showGdprFilter}">GDPR filter</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sgType : ${allSuperGroupTypes}">
                            <td th:text="${sgType}"></td>
                            <td>
                                <input type="checkbox" name="includedType"
                                       th:value="${sgType}"
                                       th:checked="${#lists.contains(unifiedIncludedTypes, sgType)}" />
                            </td>
                            <td th:if="${showGdprFilter}">
                                <input type="checkbox" name="gdprFilteredType"
                                       th:value="${sgType}"
                                       th:checked="${#lists.contains(unifiedGdprFilteredTypes, sgType)}" />
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button type="submit" data-loading-disable>Save restrictions</button>
            </form>
        </article>
    </th:block>

    <th:block th:if="${settings_form != null and (apiKey.keyType().equals('INFO') or apiKey.keyType().equals('ACCOUNT_SCAFFOLD'))}">
        <article>
            <header>Super group type restrictions (legacy)</header>
            <ul>
                <li th:each="type : ${settings_form.superGroupTypes}">
                    <span th:text="${type}"></span>
                </li>
            </ul>
        </article>
    </th:block>
</main>
