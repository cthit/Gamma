<div class="authority-super-group-post-row">
    <select class="input input--select superGroupId" required aria-label="Super group of post">
        <option th:each="superGroup : ${superGroups}" th:value="${superGroup.key}" th:text="${superGroup.value}"></option>
    </select>
    <select class="input input--select postId" required aria-label="Post">
        <option th:each="post : ${posts}" th:value="${post.key}" th:text="${post.value}"></option>
    </select>
</div>
