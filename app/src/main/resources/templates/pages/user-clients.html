<header th:replace="~{common/header}"></header>
<main>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Client ID</th>
            <th>Created by</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="client : ${clients}">
            <td th:text="${client.prettyName()}"></td>
            <td>
                <div th:replace="~{common/client-id :: clientId(clientId=${client.clientId()})}"></div>
            </td>
            <td>
                <a th:href="|/users/${client.userId()}|" th:text="${client.fullName()}"></a>
                <br th:if="${client.email() != null}">
                <a th:if="${client.email() != null}" th:href="${client.mailto()}" th:text="${client.email()}"></a>
            </td>
            <td>
                <a th:href="${'/clients/' + client.clientUid()}">Details</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
