<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article>
        <header>
            <h2 th:text="|${statusCode ?: 500} - ${statusReason ?: 'Internal Server Error'}|">500 - Internal Server Error</h2>
        </header>
        <p>Something went wrong...</p>
        <th:block th:if="${exceptionMessage != null}">
            <details class="disclosure">
                <summary class="disclosure__summary">Error details</summary>
                <p th:text="${exceptionMessage}"></p>
                <pre th:text="${exceptionStackTrace}"></pre>
            </details>
        </th:block>
        <th:block th:unless="${exceptionMessage != null}">
            <p>No additional error information is available.</p>
        </th:block>
        <footer>
            <a class="button" href="/">Go home</a>
        </footer>
    </article>
</main>
