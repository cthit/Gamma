<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article th:if="${isAdmin}">
        <header>
            <h2>Create new super group type</h2>
        </header>
        <form th:object="${form}" th:action="@{/types}" th:method="post">
            <div th:replace="~{common/input :: textInput2(field='type', label='Type')}"></div>
            <button class="button" data-loading-disable>Save</button>
        </form>
    </article>
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Types</h2>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
        <tr>
            <th>
                Name
            </th>
            <th>
                Details
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="type : ${types}">
            <td th:text="${type}"></td>
            <td>
                <a th:href="${'/types/' + type}">Details<span class="visually-hidden" th:text="| ${type}|"></span></a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
