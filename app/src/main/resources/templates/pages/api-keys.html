<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Api keys</h2>
        <a class="button" href="/api-keys/create">
            <span class="icon icon--plus" aria-hidden="true"></span>
            Create api key
        </a>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="apiKey : ${apiKeys}">
            <td th:text="${apiKey.prettyName()}"></td>
            <td th:text="${apiKey.keyType()}"></td>
            <td>
                <a th:href="${'/api-keys/' + apiKey.id()}">Details<span class="visually-hidden" th:text="| ${apiKey.prettyName()}|"></span></a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
