<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <form class="app__wide" th:action="@{/gdpr}" th:method="put" >
        <div class="toolbar">
            <h2 class="toolbar__title" id="page-title">Gdpr trained</h2>
            <button class="button" data-loading-disable>Save</button>
        </div>
        <table class="table" aria-labelledby="page-title">
            <thead>
            <tr>
                <th>Gdpr trained</th>
                <th>First Name</th>
                <th>Nick</th>
                <th>Last name</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td>
                    <input class="checkbox" type="checkbox"
                           th:name="${user.id()}"
                           th:aria-label="|Gdpr trained: ${user.firstName()} ${user.nick()} ${user.lastName()}|"
                           th:checked="${gdprTrained.contains(user.id())}"
                    />
                </td>
                <td th:text="${user.firstName()}"></td>
                <td th:text="${user.nick()}"></td>
                <td th:text="${user.lastName()}"></td>
            </tr>
            </tbody>
        </table>
    </form>
</main>
