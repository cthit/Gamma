<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Activation codes</h2>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
        <tr>
            <th>Cid</th>
            <th>Created at</th>
            <th><span class="visually-hidden">Actions</span></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="activationCode : ${activationCodes}">
            <td th:text="${activationCode.cid()}"></td>
            <td th:text="${activationCode.createdAt()}"></td>
            <td class="table__cell table__cell--end">
                <form th:data-hx-post="|/activation-codes/${activationCode.cid()}|" data-hx-target="closest tr" data-hx-swap="delete">
                    <div th:replace="~{common/form-csrf}"></div>
                    <input type="hidden" name="_method" value="delete" />
                    <button class="button button--danger" data-loading-disable>Delete activation</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
