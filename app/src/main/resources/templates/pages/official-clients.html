<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Official clients</h2>
        <a class="button" href="/clients/create">
            <span class="icon icon--plus" aria-hidden="true"></span>
            Create client
        </a>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
        <tr>
            <th>Name</th>
            <th>Client ID</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="client : ${clients}">
            <td th:text="${client.prettyName()}"></td>
            <td>
                <div th:replace="~{common/client-id :: clientId(clientId=${client.clientId()})}"></div>
            </td>
            <td>
                <a th:href="${'/clients/' + client.clientUid()}">Details<span class="visually-hidden" th:text="| ${client.prettyName()}|"></span></a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
