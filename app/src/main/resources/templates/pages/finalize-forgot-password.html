<header th:replace="~{common/header-without-nav}"></header>
<main id="main" class="app__main">
    <article th:if="${canSetUpPasskey}">
        <header>
            <h2>Sign in with a passkey (recommended)</h2>
        </header>
        <p>
            Instead of a new password, add a passkey: your phone, a security key or your computer's fingerprint
            reader or PIN. No password to remember, and it can't be phished.
        </p>
        <footer>
            <form th:action="@{/forgot-password/finalize/passkey}" th:method="post">
                <input type="hidden" name="token" th:value="${form.token()}" />
                <button class="button" data-loading-disable>Set up a passkey</button>
            </form>
        </footer>
    </article>
    <form th:object="${form}" th:action="@{/forgot-password/finalize}" th:method="post" data-hx-target="body" data-hx-swap="innerHTML">
        <article>
            <header>
                <h2 th:text="${canSetUpPasskey} ? 'Or choose a new password' : 'Finalize resetting password'"></h2>
            </header>
            <input type="hidden" name="token" th:value="${form.token()}" />
            <div th:replace="~{common/input :: passwordTextInput2('password', 'Password')}"></div>
            <div th:replace="~{common/input :: passwordTextInput2('confirmPassword', 'Confirm password')}"></div>
            <div th:replace="~{common/error :: text}"></div>
            <footer>
                <button class="button" th:classappend="${canSetUpPasskey} ? 'button--secondary'" data-loading-disable>Reset password</button>
            </footer>
        </article>
    </form>
</main>
