<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Super groups</h2>
        <a class="button" th:if="${isAdmin}" href="/super-groups/create">
            <span class="icon icon--plus" aria-hidden="true"></span>
            Create super group
        </a>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
            <tr>
                <th>
                    Pretty name
                </th>
                <th>
                    Type
                </th>
                <th>
                    Details
                </th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="superGroup : ${superGroups}">
                <td th:text="${superGroup.prettyName()}"></td>
                <td>
                    <a th:href="|/types/${superGroup.type()}|" th:text="${superGroup.type()}"></a>
                </td>
                <td>
                    <a th:href="${'/super-groups/' + superGroup.id()}">Details<span class="visually-hidden" th:text="| ${superGroup.prettyName()}|"></span></a>
                </td>
            </tr>
        </tbody>
    </table>
</main>
