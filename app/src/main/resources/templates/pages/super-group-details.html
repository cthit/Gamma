<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article th:fragment="super-group-info">
        <header><h2 th:text="${superGroup.prettyName()}"></h2></header>
        <dl class="key-value">
            <div class="key-value__row">
                <dt class="key-value__key">Id</dt>
                <dd class="key-value__value"><code th:text="${superGroup.id()}"></code></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Name</dt>
                <dd class="key-value__value" th:text="${superGroup.name()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Pretty name</dt>
                <dd class="key-value__value" th:text="${superGroup.prettyName()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Swedish description</dt>
                <dd class="key-value__value" th:text="${superGroup.svDescription()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">English description</dt>
                <dd class="key-value__value" th:text="${superGroup.enDescription()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Type</dt>
                <dd class="key-value__value" th:text="${superGroup.type()}"></dd>
            </div>
        </dl>
        <footer th:if="${isAdmin}">
            <button th:data-hx-get="@{/super-groups/{superGroupId}/edit(superGroupId=${superGroup.id()})}"
                class="button button--secondary"
                data-hx-target="closest article"
                data-hx-swap="outerHTML">
                Edit
            </button>
            <form data-hx-confirm="Are you sure you want to delete this super group?"
                  th:action="|/super-groups/${superGroup.id()}|" th:method="delete" th:if="${usages.size() == 0}">
                <button class="button button--danger" data-loading-disable>Delete</button>
            </form>
        </footer>
    </article>
    <article>
        <header><h2 th:text="|${superGroup.prettyName()}s groups|"></h2></header>
        <table class="table">
            <thead>
                <tr>
                    <th>
                        Pretty name
                    </th>
                    <th>
                        Details
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${usages.size() == 0}">
                    <td colspan="2" th:text="|${superGroup.prettyName()} has no groups|"></td>
                </tr>
                <tr th:each="group : ${usages}">
                    <td th:text="${group.prettyName()}"></td>
                    <td>
                        <a th:href="|/groups/${group.id()}|">View<span class="visually-hidden" th:text="| ${group.prettyName()}|"></span></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </article>
</main>
