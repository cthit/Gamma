<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article>
        <header>
            <h2>Create api key</h2>
        </header>
        <form id="create-api-key" th:object="${form}" th:action="@{/api-keys/create}" th:method="post">
            <div th:replace="~{common/input :: textInput2(field='prettyName', label='Pretty name')}"></div>
            <div th:replace="~{common/input :: textInput2(field='svDescription', label='Swedish description')}"></div>
            <div th:replace="~{common/input :: textInput2(field='enDescription', label='English description')}"></div>
            <label class="field">
                <span class="field__label">Key type</span>
                <select class="input input--select" th:field="*{keyType}">
                    <option th:each="type : ${keyTypes}" th:text="${type}" th:value="${type}"></option>
                </select>
            </label>
        </form>
        <footer>
            <button class="button" form="create-api-key" data-loading-disable>Create api key</button>
        </footer>
    </article>
</main>
