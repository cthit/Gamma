<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article>
        <header>
            <h2>Post details</h2>
        </header>
        <dl class="key-value">
            <div class="key-value__row">
                <dt class="key-value__key">Swedish name</dt>
                <dd class="key-value__value" th:text="${post.svName()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">English name</dt>
                <dd class="key-value__value" th:text="${post.enName()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Email prefix</dt>
                <dd class="key-value__value"><span th:if="${!post.emailPrefix().isEmpty()}" th:text="${post.emailPrefix()}"></span>
                <span th:if="${post.emailPrefix().isEmpty()}">
                    This post has no email prefix.
                </span></dd>
            </div>
        </dl>
        <footer th:if="${isAdmin}">
            <button class="button button--secondary"
                    data-hx-target="closest article"
                    th:data-hx-get="@{|/posts/${post.id()}/edit|}"
                    data-hx-swap="outerHTML" data-loading-disable>Edit post
            </button>
            <form data-hx-confirm="Are you sure you want to delete this post?" th:action="|/posts/${post.id()}|" th:method="delete">
                <button class="button button--danger" data-loading-disable>Delete</button>
            </form>
        </footer>
    </article>

    <article>
        <header>
            <h2>Post usages</h2>
        </header>
        <table class="table">
            <thead>
            <tr>
                <th>
                    Group
                </th>
                <th>
                    User
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${usages.size() == 0}">
                <td colspan="2">
                    Post has no usages.
                </td>
            </tr>
            <tr th:each="postUsage : ${usages}">
                <td>
                    <a th:text="${postUsage.groupPrettyName()}" th:href="|/groups/${postUsage.groupId()}|">
                    </a>
                </td>
                <td>
                    <a th:href="|/users/${postUsage.userId()}|" th:text="${postUsage.username()}"></a>
                </td>
            </tr>
            </tbody>
        </table>
    </article>

</main>
