<div class="member-row">
    <label class="field member-row__field member-row__field--user">
        <span class="field__label">User</span>
        <select class="input input--select userId">
            <option th:each="userKey : ${userKeys}" th:value="${userKey}" th:text="${users.get(userKey)}"></option>
        </select>
    </label>
    <div class="member-row__fields">
        <label class="field member-row__field">
            <span class="field__label">Post</span>
            <select class="input input--select postId">
                <option th:each="postKey : ${postKeys}" th:value="${postKey}" th:text="${posts.get(postKey)}"></option>
            </select>
        </label>
        <label class="field member-row__field">
            <span class="field__label">Unofficial post name</span>
            <input class="input unofficialPostName" type="text" value=""/>
        </label>
        <button class="button button--secondary button--small member-row__remove"
                type="button"
                aria-label="Delete new member"
                _="on click remove closest .member-row then call updateNames('members', '.userId', '.postId', '.unofficialPostName')">
            Delete
        </button>
    </div>
</div>
