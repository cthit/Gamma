<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article th:fragment="group-details-article">
        <header>
            <h2>Group details</h2>
        </header>
        <dl class="key-value">
            <div class="key-value__row">
                <dt class="key-value__key">Id</dt>
                <dd class="key-value__value"><code th:text="${group.id()}"></code></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Name</dt>
                <dd class="key-value__value" th:text="${group.name()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Pretty name</dt>
                <dd class="key-value__value" th:text="${group.prettyName()}"></dd>
            </div>
            <div class="key-value__row">
                <dt class="key-value__key">Super group</dt>
                <dd class="key-value__value"><a th:href="|/super-groups/${group.superGroup().id()}|" th:text="${group.superGroup().prettyName()}"></a></dd>
            </div>
        </dl>
        <h3 th:if="${members.size() > 0}">Members</h3>
        <ul th:if="${members.size() > 0}">
            <li th:each="member : ${members}">
                <a th:href="|/users/${member.userId()}|" th:text="${member.name()}"></a>
                <span aria-hidden="true"> - </span>
                <a th:href="|/posts/${member.postId()}|" th:text="${member.post()}"></a>
           </li>
        </ul>

        <footer th:if="${isAdmin}">
            <form data-hx-confirm="Are you sure you want to delete this group?" th:action="|/groups/${group.id()}|" th:method="delete">
                <button class="button button--danger" data-loading-disable>Delete</button>
            </form>
            <button
                    class="button button--secondary"
                    th:data-hx-get="@{/groups/{groupId}/edit(groupId=${group.id()})}"
                    data-hx-target="closest article"
                    data-hx-swap="outerHTML"
                    data-loading-disable>Edit
            </button>
        </footer>
    </article>

    <article th:if="${myMembers.size() > 0}">
        <header>
            <h2>Change unofficial post name for your posts</h2>
        </header>
        <p>
            Here you are able to update your unofficial post name for <span th:text="${group.prettyName()}"></span>.
            They are a more fun variant of your post name, since 'Chairman' can be a bit boring.
        </p>
        <form id="update-unofficial-post-name" th:object="${myMembershipsForm}" th:action="|/groups/${group.id()}/my-posts|" th:method="put">
            <th:block th:each="myMember : ${myMembers}">
                <div th:replace="~{common/input :: textInput2(field='postNames['+${myMember.post().id()}+']', label=${myMember.post().enName()})}"></div>
            </th:block>
        </form>
        <footer>
            <button class="button" form="update-unofficial-post-name">
                Update unofficial post names
            </button>
        </footer>
    </article>

    <th:block th:with="groupId=${group.id()}">
        <article th:fragment="group-avatar">
            <header>
                <h2>Group avatar</h2>
            </header>
            <img class="media media--avatar" th:if="${!isAdmin && !canEditImages}" th:src="@{/images/group/avatar/{id}(id=${groupId},v=${groupAvatarVersion})}" alt="Group avatar" />
            <div class="image-upload" th:if="${isAdmin || canEditImages}">
                <img class="image-upload__preview image-upload__preview--avatar" th:src="@{/images/group/avatar/{id}(id=${groupId},v=${groupAvatarVersion})}" alt="Group avatar" />
                <form class="image-upload__form" th:data-hx-post="@{/groups/avatar/{id}(id=${groupId})}"
                      _="on htmx:before:request add @disabled to the next <button/> "
                      enctype="multipart/form-data"
                      data-hx-target="closest article"
                      data-hx-swap="outerHTML"
                      id="edit-group-avatar">
                    <div th:replace="~{common/form-csrf}"></div>
                    <input type="hidden" name="_method" value="put" />
                    <label class="image-upload__label" for="edit-group-avatar-file">Choose a new avatar</label>
                    <input class="image-upload__input" id="edit-group-avatar-file"
                           _='on change remove @disabled from the next <button/>' type='file' name='file'
                           accept="image/jpeg,image/png,image/gif"
                           th:data-max-size="${imageUploadLimit.bytes()}"
                           th:data-max-size-message="|The file is too large. It must be at most ${imageUploadLimit.text()}.|">
                </form>
            </div>
            <footer th:if="${isAdmin || canEditImages}">
                <button class="button" form="edit-group-avatar" disabled data-loading-disable>Upload avatar</button>
            </footer>
        </article>

        <article th:fragment="group-banner">
            <header>
                <h2>Group banner</h2>
            </header>
            <img class="media media--banner" th:if="${!isAdmin && !canEditImages}" th:src="@{/images/group/banner/{id}(id=${groupId},v=${groupBannerVersion})}" alt="Group banner" />
            <div class="image-upload" th:if="${isAdmin || canEditImages}">
                <img class="image-upload__preview image-upload__preview--banner" th:src="@{/images/group/banner/{id}(id=${groupId},v=${groupBannerVersion})}" alt="Group banner" />
                <form class="image-upload__form" th:data-hx-post="@{/groups/banner/{id}(id=${groupId})}"
                      _="on htmx:before:request add @disabled to the next <button/> "
                      enctype="multipart/form-data"
                      data-hx-target="closest article"
                      data-hx-swap="outerHTML"
                      id="edit-group-banner">
                    <div th:replace="~{common/form-csrf}"></div>
                    <input type="hidden" name="_method" value="put" />
                    <label class="image-upload__label" for="edit-group-banner-file">Choose a new banner</label>
                    <input class="image-upload__input" id="edit-group-banner-file"
                           _='on change remove @disabled from the next <button/>' type='file' name='file'
                           accept="image/jpeg,image/png,image/gif"
                           th:data-max-size="${imageUploadLimit.bytes()}"
                           th:data-max-size-message="|The file is too large. It must be at most ${imageUploadLimit.text()}.|">
                </form>
            </div>
            <footer th:if="${isAdmin || canEditImages}">
                <button class="button" form="edit-group-banner" disabled data-loading-disable>Upload banner</button>
            </footer>
        </article>
    </th:block>
</main>
