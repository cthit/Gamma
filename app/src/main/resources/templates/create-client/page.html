<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <article>
        <header>
            <h2>Create client</h2>
        </header>
        <form id="create-clients"
              th:object="${form}"
              th:action="@{/clients/create}"
              th:method="post"
              _="on htmx:after:swap call updateNames('restrictions', '.restriction')">
            <div th:replace="~{common/input :: textInput2(field='prettyName', label='Pretty name')}"></div>
            <div th:replace="~{common/input :: textInput2(field='svDescription', label='Swedish description')}"></div>
            <div th:replace="~{common/input :: textInput2(field='enDescription', label='English description')}"></div>
            <div th:replace="~{common/input :: textInput2(field='redirectUrl', label='Redirect url')}"></div>
            <label class="choice">
                <input class="checkbox" type="checkbox" th:field="*{generateApiKey}"/>
                <span class="choice__label">Generate api key</span>
            </label>
            <label class="choice">
                <input class="checkbox" type="checkbox" th:field="*{emailScope}"/>
                <span class="choice__label">Include email scope</span>
            </label>
            <button class="button button--secondary" data-hx-get="/clients/create/new-restriction" data-hx-target="this" data-hx-swap="beforebegin" data-loading-disable>
                <span class="icon icon--plus" aria-hidden="true"></span>
                Add restriction
            </button>
        </form>
        <footer>
            <button class="button" form="create-clients" data-loading-disable>Create</button>
        </footer>
    </article>
</main>
