<a class="skip-link" href="#main">Skip to main content</a>
<div id="alerts" class="toasts">
</div>
<div id="loader-container" class="loader" aria-hidden="true" data-loading data-loading-class="loader--active">
    <div class="loader__bar"></div>
</div>
<header class="app-header app-header--standalone">
    <a class="app-header__brand" href="/">
        <img class="app-header__logo" src="/img/itlogo.svg" alt="" width="32" height="32"/>
        <h1 class="app-header__title">Gamma</h1>
    </a>
    <div class="app-header__user">
        <th:block sec:authorize="isAuthenticated()">
            <th:block th:if="${#authentication.details instanceof T(it.chalmers.gamma.security.authentication.UserAuthentication)}">
                <span class="app-header__greeting" th:text="|Hey, ${#authentication.details.gammaUser().nick().value()}!|"></span>
                <form class="app-header__logout" th:action="@{/logout}" th:method="post">
                    <button class="button button--secondary" data-loading-disable>
                        <span class="icon icon--logout" aria-hidden="true"></span>
                        Logout
                    </button>
                </form>
            </th:block>
        </th:block>
    </div>
</header>
