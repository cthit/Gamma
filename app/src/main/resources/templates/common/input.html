<!--/*
    Shared form fields. Each field renders a label, the control and, when the
    field has an error, a message that the control references through
    aria-describedby so assistive technology reads it together with the field.

    Wrap a call in <th:block th:with="autofill=true"> when the form asks for the
    signed in user's own details, so browsers may offer to fill them in
    (WCAG 1.3.5 Identify Input Purpose). Password fields are new passwords
    unless the call sets passwordPurpose='current-password'.
*/-->
<th:block th:fragment="textInput(name, label, errorMessage, value)"
          th:assert="${name != null}">
    <div class="field">
        <label class="field__label"
               th:if="${label != null}"
               th:for="${name}"
               th:text="${label}">
        </label>
        <input class="input"
               type="text"
               th:id="${name}"
               th:name="${name}"
               th:value="${value}"
               th:attr="aria-invalid=${errorMessage != null ? 'true' : null},
                       aria-describedby=${errorMessage != null ? name + '-error' : null}"
        />
        <small class="field__error"
               th:if="${errorMessage}"
               th:id="|${name}-error|"
               th:text="${errorMessage}">
        </small>
    </div>
</th:block>

<th:block th:fragment="textInput2(field, label)"
          th:assert="${field != null}">
    <div class="field"
         th:with="purpose=${field == 'cidOrEmail' ? 'username' : (autofill != true ? null : (field == 'nick' ? 'nickname' : (field == 'firstName' ? 'given-name' : (field == 'lastName' ? 'family-name' : null))))}">
        <label class="field__label"
               th:if="${label != null}"
               th:for="${#strings.replace(#strings.replace(field, '[', ''), ']', '')}"
               th:text="${label}">
        </label>
        <input class="input"
               type="text"
               th:field="*{__${field}__}"
               th:attr="aria-invalid=${#fields.hasErrors(field) ? 'true' : null},
                       aria-describedby=${#fields.hasErrors(field) ? field + '-error' : null},
                       autocomplete=${purpose}"
        />
        <small class="field__error"
               th:id="|${field}-error|"
               th:if="${#fields.hasErrors(field)}"
               th:errors="*{__${field}__}">
        </small>
    </div>
</th:block>

<th:block th:fragment="passwordTextInput2(field, label)"
          th:assert="${field != null}">
    <div class="field">
        <label class="field__label"
               th:if="${label != null}"
               th:for="${#strings.replace(#strings.replace(field, '[', ''), ']', '')}"
               th:text="${label}">
        </label>
        <input class="input"
               type="password"
               th:field="*{__${field}__}"
               th:attr="aria-invalid=${#fields.hasErrors(field) ? 'true' : null},
                       aria-describedby=${#fields.hasErrors(field) ? field + '-error' : null},
                       autocomplete=${passwordPurpose ?: (field == 'currentPassword' ? 'current-password' : 'new-password')}"
        />
        <small class="field__error"
               th:id="|${field}-error|"
               th:if="${#fields.hasErrors(field)}"
               th:errors="*{__${field}__}">
        </small>
    </div>
</th:block>
