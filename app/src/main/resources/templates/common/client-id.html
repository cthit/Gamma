<div class="client-id" th:fragment="clientId(clientId)">
    <code class="client-id__value" th:text="${clientId}"></code>
    <button type="button"
            class="button button--secondary button--small client-id__copy"
            th:data-client-id="${clientId}"
            th:aria-label="|Copy client id ${clientId}|"
            _="on click call navigator.clipboard.writeText(my @data-client-id) then put 'Copied' into the first <.client-id__copy-label/> in me then wait 1.5s then put 'Copy' into the first <.client-id__copy-label/> in me">
        <span class="icon icon--copy" aria-hidden="true"></span>
        <span class="client-id__copy-label" aria-live="polite">Copy</span>
    </button>
</div>
