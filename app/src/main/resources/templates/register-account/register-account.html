<header th:replace="~{common/header-without-nav}"></header>
<main id="main" class="app__main">
    <form th:object="${form}" th:method="post" th:action="@{/register}">
        <article>
            <header>
                <h2>Finish setting up your account</h2>
            </header>
            <input type="hidden" name="code" th:value="${form.code()}" />
            <th:block th:with="autofill=true">
                <div th:replace="~{common/input :: emailInput2('email', 'Non student email')}"></div>
                <div th:replace="~{common/input :: textInput2('nick', 'Nick')}"></div>
                <div th:replace="~{common/input :: textInput2('firstName', 'First name')}"></div>
                <div th:replace="~{common/input :: textInput2('lastName', 'Last name')}"></div>
            </th:block>
            <fieldset class="sign-in-choice">
                <legend class="field__label">How do you want to sign in?</legend>
                <label class="choice">
                    <input class="radio" type="radio" th:field="*{signInMethod}" value="passkey"
                           _="on change add @hidden to #password-fields">
                    <span class="choice__label">
                        <strong>With a passkey (recommended)</strong><br>
                        Your phone, a security key or your computer's fingerprint reader or PIN. No password to remember,
                        and it can't be phished. You add it right after creating your account.
                    </span>
                </label>
                <label class="choice">
                    <input class="radio" type="radio" th:field="*{signInMethod}" value="password"
                           _="on change remove @hidden from #password-fields">
                    <span class="choice__label">
                        <strong>With a password</strong><br>
                        You can add a passkey or an authenticator app later.
                    </span>
                </label>
            </fieldset>
            <div id="password-fields" th:hidden="${form.signInMethod() != 'password'}">
                <div th:replace="~{common/input :: passwordTextInput2('password', 'Password')}"></div>
                <div th:replace="~{common/input :: passwordTextInput2('confirmPassword', 'Confirm password')}"></div>
            </div>
            <label class="field">
                <span class="field__label">Which year did the user start at IT?</span>
                <select class="input input--select" th:field="*{acceptanceYear}">
                    <option th:each="year : ${#numbers.sequence(T(java.time.Year).now().getValue(), 2001)}"
                            th:value="${year}"
                            th:text="${year}">
                    </option>
                </select>
            </label>
            <label class="field">
                <span class="field__label">What language does the user prefer?</span>
                <select class="input input--select" th:field="*{language}">
                    <option value="SV">
                        Swedish
                    </option>
                    <option value="EN">
                        English
                    </option>
                </select>
            </label>
            <div th:replace="~{common/error :: text}"></div>
        </article>
        <article>
            <header>
                <h2>User agreement</h2>
            </header>
            <th:block th:replace="~{register-account/user-agreement}"></th:block>
            <label class="choice">
                <input class="checkbox" type="checkbox"
                       th:field="*{acceptUserAgreement}"/>
                <span class="choice__label">I accept the user agreement</span>
            </label>
            <footer>
                <button class="button" data-loading-disable>Create account</button>
            </footer>
        </article>
    </form>
</main>
