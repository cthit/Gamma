<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Users</h2>
        <a class="button" th:if="${isAdmin}" href="/users/create">
            <span class="icon icon--plus" aria-hidden="true"></span>
            Create user
        </a>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
            <tr>
                <th>First name</th>
                <th>Nick</th>
                <th>Last name</th>
                <th>Cid</th>
                <th>Acceptance year</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.firstName()}"></td>
                <td th:text="${user.nick()}"></td>
                <td th:text="${user.lastName()}"></td>
                <td th:text="${user.cid()}"></td>
                <td th:text="${user.acceptanceYear()}"></td>
                <td>
                    <a th:href="${'/users/' + user.id}">Details<span class="visually-hidden" th:text="| ${user.nick()}|"></span></a>
                </td>
            </tr>
        </tbody>
    </table>
</main>
