<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <title>Gamma</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <link rel="shortcut icon" type="image/svg" th:href="@{/img/itlogo.svg}" />

    <link rel="stylesheet" th:href="@{/webjars/picocss__pico/2.1.1/css/pico.green.min.css}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <meta name="htmx-config"
          content='{
            "includeIndicatorCSS": false,
            "history": "reload",
            "allowEmptySwapAfterOOB": true

    <script th:src="@{/webjars/htmx.org/4.0.0/dist/htmx.min.js}"></script>
    <script th:src="@{/webjars/hyperscript.org/0.9.93/dist/_hyperscript.min.js}"></script>

    <script th:src="@{/js/htmx-setup.js}"></script>
    <script th:src="@{/js/reorder.js}"></script>
    <script th:src="@{/js/posts-sortable.js}"></script>
</head>
<body class="container-fluid"
      hx-boost:inherited="true"
      _="on htmx:after:swap remove .show-nav from document.body"
      data-loading-delay="500">
    <th:block th:replace="~{__${page}__}"></th:block>

</html>
