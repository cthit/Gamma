<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <title>Gamma</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <link rel="shortcut icon" type="image/svg" th:href="@{/img/itlogo.svg}" />

    <link rel="stylesheet" th:href="@{/css/main.css}" />


    <meta name="htmx-config"
          content='{
            "includeIndicatorCSS": false,
            "history": "reload",
            "allowEmptySwapAfterOOB": true,
            "defaultSettleDelay": 0
          }'
    >

    <script th:src="@{/webjars/htmx.org/4.0.1/dist/htmx.min.js}"></script>
    <script th:src="@{/webjars/hyperscript.org/0.9.93/dist/_hyperscript.min.js}"></script>
    <script th:src="@{/webjars/sortablejs/1.15.7/Sortable.min.js}"></script>

    <script th:src="@{/js/htmx-setup.js}"></script>
    <script th:src="@{/js/reorder.js}"></script>
    <script th:src="@{/js/posts-sortable.js}"></script>
    <script th:src="@{/js/passkeys.js}"></script>
</head>
<body class="app"
      hx-boost:inherited="true"
      _="on htmx:after:swap remove .app--nav-open from document.body then set @aria-expanded of <.app-header__menu/> to 'false'"
      data-loading-delay="500">
    <th:block th:replace="~{__${page}__}"></th:block>
</body>
</html>
