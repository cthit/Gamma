<header th:replace="~{common/header}"></header>
<main id="main" class="app__main">
    <div class="toolbar">
        <h2 class="toolbar__title" id="page-title">Groups</h2>
        <a class="button" th:if="${isAdmin}" href="/groups/create">
            <span class="icon icon--plus" aria-hidden="true"></span>
            Create group
        </a>
    </div>
    <table class="table" aria-labelledby="page-title">
        <thead>
        <tr>
            <th>Name</th>
            <th>Super group</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="group : ${groups}">
            <td th:text="${group.prettyName()}"></td>
            <td th:text="${group.superGroup().prettyName()}"></td>
            <td>
                <a th:href="${'/groups/' + group.id}">Details<span class="visually-hidden" th:text="| ${group.prettyName()}|"></span></a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
