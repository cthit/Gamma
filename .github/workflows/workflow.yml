name: Build and Test

on:
  push:
    branches: [main]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        timeout-minutes: 20
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
        timeout-minutes: 20

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        timeout-minutes: 20
        with:
          fail-on-severity: high

      - name: Check
        run: ./gradlew check -x detektCheck -x detekt
        timeout-minutes: 20

      - name: Detekt
        run: ./gradlew detektCheck
        timeout-minutes: 20
        # Detekt 2.x is still alpha. Keep failures visible on Renovate PRs without blocking dependency updates.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.actor == 'renovate[bot]' }}

  build-and-publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        timeout-minutes: 20
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        timeout-minutes: 20

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        timeout-minutes: 20
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        timeout-minutes: 20
        with:
          images: ghcr.io/${{ github.repository_owner }}/gamma
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=edge
            type=ref,event=pr

      - name: Build Docker image
        run: ./gradlew bootBuildImage
        timeout-minutes: 20

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        timeout-minutes: 20
        with:
          image: app:latest
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: gamma-image-sbom

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        timeout-minutes: 20
        with:
          image-ref: app:latest
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push docker image
        id: push
        timeout-minutes: 20
        run: |
          for tag in $(jq -r '.tags | join(" ")' <<< $DOCKER_METADATA_OUTPUT_JSON ); do
            docker image tag app:latest $tag
          done
          docker image push --all-tags ghcr.io/${{ github.repository_owner }}/gamma
          IMAGE_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' app:latest | cut -d@ -f2)
          test -n "$IMAGE_DIGEST"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        timeout-minutes: 20
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gamma
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  e2e-tests:
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'skipped')
    needs: [verify, build-and-publish]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 20
        with:
          persist-credentials: false

      - name: Set up JDK 25
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        timeout-minutes: 20
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 20
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        timeout-minutes: 20
        with:
          version: 10.18.3

      - name: Install dependencies
        run: cd e2e && pnpm install --frozen-lockfile
        timeout-minutes: 20

      - name: Audit E2E dependencies
        run: cd e2e && pnpm audit --audit-level high
        timeout-minutes: 20

      - name: Check code formatting
        run: cd e2e && pnpm run format:check
        timeout-minutes: 20

      - name: Typecheck E2E
        run: cd e2e && pnpm run typecheck
        timeout-minutes: 20

      - name: Lint E2E
        run: cd e2e && pnpm run lint
        timeout-minutes: 20

      - name: Install Playwright Browsers
        run: cd e2e && pnpm exec playwright install --with-deps chromium
        timeout-minutes: 20

      - name: Build untrusted PR image locally
        if: github.event_name == 'pull_request'
        run: make build-image
        timeout-minutes: 20

      - name: Pull trusted published image
        if: github.event_name == 'push'
        run: |
          SHA="${{ github.sha }}"
          docker pull "ghcr.io/${{ github.repository_owner }}/gamma:sha-${SHA:0:7}"
          docker image tag "ghcr.io/${{ github.repository_owner }}/gamma:sha-${SHA:0:7}" gamma-app:test

      - name: Run E2E tests
        run: cd e2e && pnpm test
        timeout-minutes: 40

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 20
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
