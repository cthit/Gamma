name: Build and Test

on:
  push:
    branches: [main]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches: [main]
  merge_group:

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 20

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        timeout-minutes: 20
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
        timeout-minutes: 20

      - name: Check
        run: ./gradlew check
        timeout-minutes: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        timeout-minutes: 20

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        timeout-minutes: 20
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        timeout-minutes: 20
        with:
          images: ghcr.io/${{ github.repository_owner }}/gamma
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=edge
            type=ref,event=pr

      - name: Build Docker image
        run: ./gradlew bootBuildImage
        timeout-minutes: 20

      - name: Push docker image
        timeout-minutes: 20
        run: |
          for tag in $(jq -r '.tags | join(" ")' <<< $DOCKER_METADATA_OUTPUT_JSON ); do
            docker image tag app:latest $tag
          done
          docker image push --all-tags ghcr.io/${{ github.repository_owner }}/gamma

  e2e-shard:
    needs: build-and-publish
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 20

      - name: Set up JDK for upload storage regression probe
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: actions/setup-node@v7
        timeout-minutes: 20
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        timeout-minutes: 20
        with:
          package_json_file: e2e/package.json

      - name: Install dependencies
        run: cd e2e && pnpm install
        timeout-minutes: 20

      - name: Check code formatting
        if: matrix.shard == 1
        run: cd e2e && pnpm run format:check
        timeout-minutes: 20

      - name: Typecheck E2E
        if: matrix.shard == 1
        run: cd e2e && pnpm run typecheck
        timeout-minutes: 20

      - name: Lint E2E
        if: matrix.shard == 1
        run: cd e2e && pnpm run lint
        timeout-minutes: 20

      - name: Install Playwright Browsers
        run: cd e2e && pnpm exec playwright install --with-deps chromium
        timeout-minutes: 20

      - name: Determine Gamma version
        id: gamma-version
        timeout-minutes: 20
        run: |
          SHA="${{ github.sha }}"
          echo "version=sha-${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        run: make test-e2e GAMMA_VERSION=${{ steps.gamma-version.outputs.version }} E2E_ARGS="--shard=${{ matrix.shard }}/4"
        # Keep one worker per runner: Docker interface churn interrupts Chromium on Linux.
        # Sharding across 4 runners keeps each shard (~45 isolated tests) well under the timeout.
        timeout-minutes: 35

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        timeout-minutes: 20
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload raw Playwright test results
        uses: actions/upload-artifact@v7
        timeout-minutes: 20
        if: ${{ failure() }}
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-tests:
    needs: [build-and-publish, e2e-shard]
    if: always() && needs.build-and-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all E2E shards succeeded
        if: needs.e2e-shard.result != 'success'
        run: exit 1
